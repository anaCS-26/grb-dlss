; GRB-DLSS - DLSS Super Resolution for Ghost Recon Breakpoint (DirectX 11)
; Replaces the game's TAA / Temporal Injection pass with NVIDIA DLSS.
; In game: Anti-Aliasing = TAA (Temporal Injection on). Pick the render resolution in the mod's menu (Home key)
; or with RenderScale below. Saving this file applies most changes in-game, no restart needed.

[DLSS]
; 1 = DLSS replaces the game's TAA, 0 = mod does nothing
Enabled=1
; Key that switches between DLSS and the game's own TAA while playing (virtual-key code, 0 = off). 0x23 = End
ToggleKey=0x23
; Key that opens the in-game menu (render scale %, preset, DLSS on/off). 0x24 = Home
MenuKey=0x24
; DLSS preset: 0 = NVIDIA default, or a letter: F (CNN), J, K (DLSS 4 transformer), L, M (DLSS 4.5 transformer).
; K is the best quality/cost balance on mid-range and laptop GPUs; L/M look slightly better but cost ~2x more.
Preset=K
; Key that cycles presets in-game (virtual-key code, 0 = off)
PresetCycleKey=0
; Internal render resolution in percent of the output (25-100), or 0 = use the game's own Resolution Scale.
; 100 = DLAA, 67 = Quality, 58 = Balanced, 50 = Performance, 33 = Ultra Performance
RenderScale=0
; Keys that raise / lower RenderScale in-game (0x21 = Page Up, 0x22 = Page Down), and the step in percent
RenderScaleUpKey=0x21
RenderScaleDownKey=0x22
RenderScaleStep=5
; auto = picked from the render scale. Or: dlaa, ultraquality, quality, balanced, performance, ultraperformance
QualityMode=auto
; Feed the game's "responsive AA" mask (particles, etc.) to DLSS as a bias-current-colour mask
UseResponsiveMask=0
; 1 = build full-resolution dilated motion vectors (mainly useful for frame generation), 0 = low-res MVs
DilatedMotionVectors=0
; HDR only: let DLSS compute exposure
AutoExposureHDR=1

[Compat]
; Report the D3D feature level the game asked for (needed when OptiScaler is installed)
ReportRequestedFeatureLevel=1
; Pass the game's real camera matrices to OptiScaler's DLSS frame generation (experimental)
FGCameraData=0

[Advanced]
; Multipliers for the game's sub-pixel jitter before it is passed to DLSS (sign convention)
JitterScaleX=-1.0
JitterScaleY=-1.0
; -1 = auto-detect reversed depth from the game's projection, 0 = normal, 1 = reversed
DepthInverted=-1
; 0 = off, diagnostics: 1 = motion vectors, 2 = depth
DebugView=0
HookDelayMs=0

[Log]
; 0 = errors, 1 = info, 2 = debug
LogLevel=1
; 1 = include NVIDIA NGX log lines in GRB_DLSS.log
NGXLogging=0
; developer: live commands via GRB_DLSS_cmd.ini (probe, debug views)
DevCommands=0
